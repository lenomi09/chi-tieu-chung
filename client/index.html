<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiêu chung</title>
    <script>
      // Áp lại giao diện sáng/tối đã lưu NGAY LẬP TỨC, trước khi trang vẽ ra —
      // để tránh nhấp nháy sáng rồi mới chuyển tối (FOUC) lúc tải trang.
      ;(function () {
        try {
          var saved = localStorage.getItem('chi-tieu-chung-theme')
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.classList.toggle('dark', saved === 'dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
